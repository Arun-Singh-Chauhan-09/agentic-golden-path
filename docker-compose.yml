# Lightweight local stack: the app + Prometheus + Grafana, no Kubernetes.
#   make observe   (or: docker compose up --build)
# Grafana comes up with the datasource and the SLO dashboard already loaded.
services:
  app:
    build:
      context: ./app
      args:
        VERSION: compose
    environment:
      MOCK_LLM: "true"
      FAILURE_RATE: "${FAILURE_RATE:-0}"
      EXTRA_LATENCY_MS: "${EXTRA_LATENCY_MS:-0}"
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./observability/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/compose/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./observability/compose/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./k8s/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
