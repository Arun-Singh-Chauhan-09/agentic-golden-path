# Weekly update PRs. CI runs on each one, so an upgrade only lands if the
# tests, the Trivy scan and the policy gates still pass.
# GitHub Actions are SHA-pinned; Dependabot updates the SHA and the
# "# vX.Y.Z" comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/envs/dev
    schedule:
      interval: monthly
