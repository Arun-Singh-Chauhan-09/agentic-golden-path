name: release

# Tag-driven release, fully GitOps:
#   make release VERSION=0.3.0      (or: git tag v0.3.0 && git push origin v0.3.0)
#     -> build + push ghcr.io/<owner>/agentic-golden-path:0.3.0 (with SBOM + provenance)
#     -> bump newTag in k8s/kustomization.yaml and commit to main
#     -> ArgoCD sees the commit and rolls the Deployment
#     -> GitHub Release with generated notes
# Nobody edits a manifest or runs kubectl to ship a version.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write # release + GitOps commit
  packages: write # push to GHCR

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Derive version and image name
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          # GHCR image names must be lowercase
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agentic-golden-path" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./app
          build-args: VERSION=${{ steps.meta.outputs.version }}
          push: true
          provenance: mode=max # signed build provenance attestation
          sbom: true # software bill of materials attached to the image
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}

      - name: Point GitOps at the new image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git checkout main
          git pull --ff-only origin main
          sed -i -E "s/^([[:space:]]*newTag:).*/\1 ${VERSION}/" k8s/kustomization.yaml
          grep -n "newTag:" k8s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "kustomization already at ${VERSION}"
          else
            git commit -am "chore(release): deploy v${VERSION}"
            git push origin main
          fi

      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
