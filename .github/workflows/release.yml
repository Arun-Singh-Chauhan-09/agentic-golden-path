name: release

# Tag-driven release, fully GitOps:
#   make release VERSION=0.3.0      (or: git tag v0.3.0 && git push origin v0.3.0)
#     -> build + push ghcr.io/<owner>/agentic-golden-path:0.3.0 (with SBOM + provenance)
#     -> bump newTag in k8s/kustomization.yaml and commit to main
#     -> ArgoCD sees the commit and rolls the Deployment
#     -> GitHub Release with generated notes
# Nobody edits a manifest or runs kubectl to ship a version.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write # release + GitOps commit
  packages: write # push to GHCR

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Derive version and image name
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          # GHCR image names must be lowercase
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agentic-golden-path" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app
          build-args: VERSION=${{ steps.meta.outputs.version }}
          push: true
          provenance: mode=max # signed build provenance attestation
          sbom: true # software bill of materials attached to the image
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}

      - name: Point GitOps at the new image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git checkout main
          git pull --ff-only origin main
          sed -i -E "s/^([[:space:]]*newTag:).*/\1 ${VERSION}/" k8s/kustomization.yaml
          grep -n "newTag:" k8s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "kustomization already at ${VERSION}"
          else
            git commit -am "chore(release): deploy v${VERSION}"
            git push origin main
          fi

      - name: GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
