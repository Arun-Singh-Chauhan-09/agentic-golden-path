name: deploy

# AWS deployment. Skipped entirely until the repository variable AWS_ENABLED
# is "true" and the AWS_DEPLOY_ROLE_ARN secret exists, so the repo stays green
# without an AWS account. The free, local equivalent is the kind/ArgoCD track.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never interrupt an in-flight deploy

env:
  AWS_REGION: eu-central-1

jobs:
  build-push:
    name: Build & push image
    if: vars.AWS_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, tag, push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: agentic-gp-${{ github.event.inputs.environment || 'dev' }}   # ECR repo == service name
          TAG: ${{ github.sha }}
        run: |
          docker build --build-arg VERSION="$TAG" -t "$REGISTRY/$REPO:$TAG" app
          docker push "$REGISTRY/$REPO:$TAG"

  deploy:
    name: Terraform apply & roll out
    needs: build-push
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}  # GitHub env gate (prod needs approval)
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Set env dir
        run: echo "TF_ENV_DIR=infra/envs/${{ github.event.inputs.environment || 'dev' }}" >> "$GITHUB_ENV"
      - name: Apply
        run: |
          terraform -chdir=$TF_ENV_DIR init
          terraform -chdir=$TF_ENV_DIR apply -auto-approve \
            -var="image_tag=${{ needs.build-push.outputs.image_tag }}"
      - name: Wait for ECS to reach steady state
        # The service's deployment circuit breaker (enabled in the ecs-service
        # module) auto-rolls-back a failed task set. This step makes the job
        # fail loudly if the new revision never stabilises.
        run: |
          CLUSTER=$(terraform -chdir=$TF_ENV_DIR output -raw cluster_name)
          SERVICE=$(terraform -chdir=$TF_ENV_DIR output -raw service_name)
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
      - name: Smoke test
        run: |
          URL=$(terraform -chdir=$TF_ENV_DIR output -raw service_url)
          for i in $(seq 1 10); do
            if curl -fsS "$URL/health"; then echo "healthy"; exit 0; fi
            sleep 10
          done
          echo "service did not pass smoke test"; exit 1
