# Port chain (keep these in sync):
#   app listens 8000 == containerPort "http" == Service targetPort http
#   Service nodePort 30090 == kind extraPortMapping 30090 -> localhost:8090
apiVersion: v1
kind: Service
metadata:
  name: agentic-gp
  labels:
    app: agentic-gp
spec:
  type: NodePort
  selector:
    app: agentic-gp
  ports:
    - name: http # the ServiceMonitor scrapes this port by name
      port: 80
      targetPort: http
      nodePort: 30090
