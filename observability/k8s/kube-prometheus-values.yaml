# Helm values for kube-prometheus-stack on the local kind cluster.
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f observability/k8s/kube-prometheus-values.yaml

# --- Prometheus ------------------------------------------------------------
prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors/PrometheusRules from every namespace, not only
    # ones labelled for this Helm release. The app ships its own in k8s/.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 6h # long enough for the 1h burn-rate window; it's a laptop
    resources:
      requests:
        cpu: 100m
        memory: 384Mi

# --- Alertmanager ------------------------------------------------------------
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
  config:
    global:
      resolve_timeout: 2m
    route:
      receiver: default
      group_by: ["alertname", "namespace"]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 4h
      routes:
        # Watchdog always fires by design: it proves the alert pipeline is
        # alive. Route it to a null receiver so it doesn't clutter the demo.
        - matchers: ['alertname = "Watchdog"']
          receiver: "null"
        - matchers: ['severity = "critical"']
          receiver: critical
    # One page per incident: when the whole service is down, or already
    # paging for errors, the follow-on warnings are suppressed.
    inhibit_rules:
      - source_matchers: ['alertname = "AgentAllReplicasDown"']
        target_matchers: ['alertname =~ "AgentReplicaDown|AgentHighLatencyP95|AgentErrorBudgetBurn"']
        equal: ["namespace"]
      - source_matchers: ['alertname = "AgentHighErrorRate"']
        target_matchers: ['alertname = "AgentErrorBudgetBurn"']
        equal: ["namespace"]
    receivers:
      - name: "null"
      - name: default
      # To get real notifications, add e.g. slack_configs here.
      - name: critical

# --- Grafana -----------------------------------------------------------------
grafana:
  adminPassword: admin # local demo only
  service:
    type: NodePort
    nodePort: 30030 # kind maps this to localhost:3030
  defaultDashboardsEnabled: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL # the app's dashboard lives in the agentic-gp namespace
    datasources:
      defaultDatasourceEnabled: true
      uid: prometheus # dashboards reference this uid
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false

# --- Components that can't be scraped on kind --------------------------------
# kind binds these control-plane components to 127.0.0.1, so Prometheus would
# show them as DOWN and fire alerts that have nothing to do with the app.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
