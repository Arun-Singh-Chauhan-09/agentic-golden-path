# Local Prometheus config for `make observe` (docker-compose stack).
# In AWS the same metrics are collected via CloudWatch + Container Insights;
# this is the developer-laptop view of the golden path.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: agentic-gp
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
